name: Build FreeSHIP for Windows

on:
  push:
    branches:
      - save-fix
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install official Lazarus 3.2 and Free Pascal 3.2.2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "lazarus-3.2-fpc-3.2.2-win64.exe"
          $url = "https://download.lazarus-ide.org/Lazarus%20Windows%2064%20bits/Lazarus%203.2/lazarus-3.2-fpc-3.2.2-win64.exe"
          $expectedHash = "78605F116251C60595108FCF41004EE3DDC0B5CC7C22143E52A53FA1ED629D54"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Lazarus installer SHA-256 mismatch. Expected $expectedHash, got $actualHash."
          }

          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Lazarus installer failed with exit code $($process.ExitCode)."
          }

          $lazarus = "C:\lazarus"
          $fpc = "$lazarus\fpc\3.2.2\bin\x86_64-win64"
          if (!(Test-Path "$lazarus\lazbuild.exe") -or !(Test-Path "$fpc\fpc.exe")) {
            throw "The official Lazarus installer did not place lazbuild.exe and fpc.exe in the expected locations."
          }

          # Make the compiler available to tools invoked by lazbuild.
          "$lazarus;$fpc" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LAZARUS_DIR=$lazarus" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FPC_DIR=$fpc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Free Pascal
        shell: pwsh
        run: |
          $fpc = "$env:FPC_DIR\fpc.exe"
          $fpcmkcfg = "$env:FPC_DIR\fpcmkcfg.exe"
          if (!(Test-Path $fpcmkcfg)) {
            throw "The Lazarus installation is missing fpcmkcfg.exe."
          }

          & $fpcmkcfg -d "basepath=$env:LAZARUS_DIR\fpc\3.2.2" -o "$env:FPC_DIR\fpc.cfg"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:FPC_DIR\fpc.cfg")) {
            throw "Could not generate the Free Pascal compiler configuration."
          }

          & $fpc -iV
          if ($LASTEXITCODE -ne 0) {
            throw "Free Pascal could not start with its generated configuration."
          }

      - name: Register Lazarus component packages
        shell: pwsh
        run: |
          $packages = @(
            "$env:LAZARUS_DIR\components\lazutils\lazutils.lpk",
            "$env:LAZARUS_DIR\components\lazcontrols\lazcontrols.lpk",
            "$env:LAZARUS_DIR\components\tachart\tachartlazaruspkg.lpk",
            "$env:LAZARUS_DIR\components\printers\printer4lazarus.lpk"
          )

          foreach ($package in $packages) {
            if (!(Test-Path $package)) {
              throw "The official Lazarus installation is missing required package source: $package"
            }

            & "$env:LAZARUS_DIR\lazbuild.exe" --add-package-link $package
            if ($LASTEXITCODE -ne 0) {
              throw "Lazarus could not register package: $package"
            }
          }

      - name: Prepare revision metadata expected by the project
        shell: pwsh
        run: |
          # The project's pre-build script reads this Git ref directly.
          New-Item -ItemType Directory -Force .git\refs\heads | Out-Null
          $master = git rev-parse origin/master
          if ($LASTEXITCODE -ne 0 -or !$master) {
            throw "Could not resolve origin/master."
          }
          Set-Content -NoNewline .git\refs\heads\master $master

      - name: Build 64-bit Windows release
        shell: pwsh
        run: |
          & "$env:LAZARUS_DIR\lazbuild.exe" --build-all --build-mode="Win64 Release" FreeShip.lpi
          if ($LASTEXITCODE -ne 0) {
            throw "FreeSHIP compilation failed."
          }
          if (!(Test-Path "FreeShip.exe")) {
            throw "The build completed without producing FreeShip.exe."
          }

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item FreeShip.exe dist\
          if (Test-Path locale) {
            Copy-Item locale dist\locale -Recurse
          }
          @"
          FreeSHIP Windows x64 build

          Built from kotori/freeship-plus-in-lazarus.
          Extract the ZIP and run FreeShip.exe.
          "@ | Set-Content dist\README.txt
          Compress-Archive -Path dist\* -DestinationPath FreeShip-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeSHIP-Windows-x64
          path: FreeShip-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: FreeShip-Windows-x64.zip
